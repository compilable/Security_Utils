version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: password-hash-generator
    ports:
      - "8070:80"
    volumes:
      - .:/var/www/html
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=sec_utils"
      - "description=Password Hash Generator v2.0.0"